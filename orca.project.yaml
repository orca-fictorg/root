composeFiles:
  primary: docker-compose.yml

envFiles:
  - path: .dockerenv

tlsCerts:
  - '*.orca-fictorg.test'

hosts:
  - root.orca-fictorg.test

extensions:
  - name: dockerenv
    type: syncFile
    source: .dockerenv.example
    target: .dockerenv
    description: Create .dockerenv from .dockerenv.example

hooks:
  clone:
    post:
      - extension: dockerenv
